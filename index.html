<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自然拼读背单词</title>
<style>
  /* ============ 全局基础样式 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 24px 16px 48px;
    color: #333;
  }

  /* ============ 全屏 loading 遮罩(数据加载/接口请求时使用) ============ */
  #loading-mask {
    position: fixed; inset: 0;
    background: rgba(40, 30, 80, .55);
    display: none;
    align-items: center; justify-content: center;
    z-index: 999;
  }
  #loading-mask.show { display: flex; }
  #loading-mask .spinner {
    width: 52px; height: 52px;
    border: 5px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ 顶部标题 ============ */
  header { text-align: center; color: #fff; margin-bottom: 20px; }
  header h1 { font-size: 26px; letter-spacing: 2px; }

  /* ============ 视图切换:三个视图(首页/学习/生词本) ============ */
  .view { display: none; max-width: 860px; margin: 0 auto; }
  #view-study { max-width: 1080px; } /* 学习页含侧边导航,适当加宽 */
  .view.active { display: block; animation: fadeIn .25s ease; }
  /* 学习页整屏布局:高度锁定为可视区高减去页眉页脚,主体撑满剩余空间,
   * 这样侧边单词导航和操作按钮都能自然铺到页面底部,不需要下拉
   * --vh / --chrome 由 app.js 实时量取(地址栏收起、横竖屏切换都会更新) */
  #view-study.active {
    display: flex; flex-direction: column;
    height: calc(var(--vh, 100vh) - var(--chrome, 148px));
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ============ 首页:快捷入口(全部单词/单词测试/生词本) ============ */
  .quick-entries { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
  .entry-card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 4px 10px rgba(0,0,0,.12);
    cursor: pointer;
    transition: transform .15s ease;
  }
  .entry-card:hover { transform: translateY(-3px); }
  .entry-card .entry-title { font-size: 17px; font-weight: 700; color: #4a3b9c; }
  .entry-card .entry-count { font-size: 13px; color: #888; margin-top: 6px; }

  /* ============ 首页:分组卡片网格 ============ */
  .group-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }
  .group-card {
    background: #fff;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,.12);
    display: flex; flex-direction: column; gap: 8px;
  }
  .group-card .group-name { font-size: 16px; font-weight: 700; color: #333; }
  .group-card .group-info { font-size: 12px; color: #999; }
  /* 已会进度条 */
  .group-progress { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
  .group-progress i { display: block; height: 100%; background: #51cf66; border-radius: 3px; }
  /* 分组卡片上的功能入口按钮 */
  .group-card .btn-start {
    border: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 14px;
    padding: 8px 0;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .group-card .btn-start:active { opacity: .85; }

  /* ============ 学习页:顶部工具栏 ============ */
  .study-topbar {
    display: flex; align-items: center; justify-content: space-between;
    color: #fff; margin-bottom: 16px; gap: 10px;
  }
  .btn-back {
    border: none; background: rgba(255,255,255,.2); color: #fff;
    padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer;
  }
  .study-progress-text { font-size: 15px; font-weight: 600; }
  /* 右上角章节名:做成小胶囊按钮,点击弹出章节列表切换章节 */
  .study-source {
    display: inline-flex; align-items: center; gap: 4px;
    border: none; background: rgba(255,255,255,.2); color: #fff;
    font-family: inherit; font-size: 13px; line-height: 1.2;
    padding: 8px 14px; border-radius: 20px; cursor: pointer;
    max-width: 42vw; /* 窄屏不挤掉左侧返回键与进度 */
  }
  .study-source:active { background: rgba(255,255,255,.32); }
  /* 章节名过长时省略,下拉箭头始终可见 */
  .study-source .src-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .study-source .src-caret { font-size: 10px; opacity: .9; flex-shrink: 0; }

  /* 学习进度条 */
  .study-progress { height: 8px; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
  .study-progress i { display: block; height: 100%; background: #ffd54f; border-radius: 4px; transition: width .3s ease; }

  /* ============ 学习页主体:侧边单词导航 + 卡片区域 ============ */
  /* flex:1 让主体吃满学习页剩余高度(见上方 #view-study.active 整屏布局) */
  .study-body { display: flex; gap: 16px; align-items: stretch; flex: 1; min-height: 0; }
  .study-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* 侧边导航栏:展示本次学习分组的所有单词,点击跳转
   * 高度由 .study-body 的 stretch 对齐撑满,与卡片区域同高、一直铺到页面底部,
   * 词表过长时栏内滚动 */
  .word-nav {
    width: 190px; flex-shrink: 0;
    background: rgba(255,255,255,.94);
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    overflow-y: auto;
  }
  .word-nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px; border-radius: 8px;
    font-size: 14px; color: #444;
    cursor: pointer;
  }
  .word-nav-item:hover { background: #f1f0fa; }
  /* 未掌握的单词:橙色底 + 左侧色条高亮,一眼看出还有哪些要背 */
  .word-nav-item.unknown { background: #fff3bf; border-left: 3px solid #f59f00; }
  /* 当前正在学习的单词高亮(排在 .unknown 之后,优先级更高) */
  .word-nav-item.active { background: #e5dbff; color: #5f3dc4; font-weight: 700; }
  .word-nav-item .nav-en { flex-shrink: 0; }
  /* 释义只取第一个,超出省略 */
  .word-nav-item .nav-zh {
    flex: 1; min-width: 0;
    font-size: 11px; color: #999; font-weight: 400;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 未掌握圆点:默认显示,标记已会后隐藏 */
  .word-nav-item .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: #f59f00; flex-shrink: 0; }
  /* 已会标记:默认隐藏,已会的词显示绿色勾 */
  .word-nav-item .nav-tick { display: none; color: #51cf66; font-size: 12px; flex-shrink: 0; }
  .word-nav-item.known .nav-tick { display: inline; }
  .word-nav-item.known .nav-dot { display: none; }
  .word-nav-item.known .nav-en { color: #868e96; } /* 已会的词淡化,与高亮形成对比 */
  /* 窄屏(手机)侧边栏的宽度与显示精简,见文末"手机端紧凑布局" */

  /* ============ 学习页:单词卡片 ============ */
  .flashcard {
    background: #fff;
    border-radius: 20px;
    padding: 44px 24px 32px;
    text-align: center;
    box-shadow: 0 10px 28px rgba(0,0,0,.22);
    user-select: none;
    cursor: pointer; /* 点卡片任意空白处 = 下一个单词 */
    position: relative;
    min-height: 260px;
    /* 整屏布局下吃掉卡片区域的绝大部分剩余高度(远高于图例/按钮的伸展权重),
     * 使卡片底部与侧边导航底部对齐;空间不足时可收缩 */
    flex: 8 1 auto;
    display: flex; flex-direction: column; justify-content: center;
  }
  /* 窄屏(手机):卡片内边距/字号收紧,详见文末"手机端紧凑布局"统一媒体查询 */
  /* 已会角标 */
  .flashcard .known-badge {
    position: absolute; top: 14px; right: 16px;
    background: #51cf66; color: #fff;
    font-size: 12px; padding: 3px 10px; border-radius: 12px;
    display: none;
  }
  .flashcard .known-badge.show { display: block; }
  /* 生词本角标 */
  .flashcard .wordbook-badge {
    position: absolute; top: 14px; left: 16px;
    background: #ff922b; color: #fff;
    font-size: 12px; padding: 3px 10px; border-radius: 12px;
    display: none;
  }
  .flashcard .wordbook-badge.show { display: block; }

  /* 彩色自然拼读分段单词:每个分段是一个"字母+读音"上下结构的小块 */
  .phonics-word { font-size: 44px; font-weight: 800; letter-spacing: 1px; line-height: 1.3; word-break: break-word; }
  .seg-block {
    display: inline-block; text-align: center; vertical-align: top;
    border-radius: 10px;
    transition: transform .15s ease, background .15s ease; /* 拼读高亮动画过渡 */
  }
  .seg-sound {
    display: block;
    font-size: 13px; font-weight: 400; letter-spacing: 0;
    opacity: .78; /* 读音与字母同色,略淡以区分层次 */
    min-height: 18px; /* 无读音的分段(不发音 e/符号)也占位,保持字母对齐 */
  }
  .phonics-word .seg-consonant { color: #2b7de9; } /* 单辅音:蓝 */
  .phonics-word .seg-cdigraph { color: #7048e8; } /* 辅音组合:紫 */
  .phonics-word .seg-vowel    { color: #e5484d; } /* 单元音:红 */
  .phonics-word .seg-vteam    { color: #f08c00; } /* 元音组合/R控元音:橙 */
  .phonics-word .seg-long     { color: #2f9e44; } /* 长元音(magic e):绿 */
  .phonics-word .seg-silent   { color: #adb5bd; } /* 不发音字母:灰 */
  .phonics-word .seg-other    { color: #868e96; font-weight: 400; white-space: pre; } /* 空格/符号;pre 保留词间空格(如 who is 不被折叠成 whois) */

  /* 自然拼读动画:当前播放的分段放大并加底色 */
  .seg-block.seg-playing {
    transform: scale(1.28);
    background: #fff0c2;
    box-shadow: 0 3px 10px rgba(240, 140, 0, .35);
  }
  /* 整词播放时:整个单词轻微脉冲高亮 */
  .phonics-word.word-playing .seg-block { background: #d8f5dc; }
  .phonics-word.word-playing { animation: wordPulse .6s ease infinite alternate; }
  @keyframes wordPulse {
    from { transform: scale(1); }
    to   { transform: scale(1.04); }
  }

  /* 整词音标(IPA) */
  .phonetic { margin-top: 12px; font-size: 18px; color: #777; min-height: 24px; }

  /* ============ 词对词条(同义词/反义词/缩略词):拆成左右两张小卡片 ============ */
  .pair-wrap {
    display: flex; align-items: stretch; justify-content: center;
    gap: 10px; flex-wrap: wrap;
  }
  .pair-card {
    flex: 1 1 0; min-width: 200px; max-width: 46%;
    background: #f8f7fd;
    border: 1px solid #ece9f7;
    border-radius: 14px;
    padding: 16px 10px 12px;
    text-align: center;
  }
  .pair-card .phonics-word { font-size: 30px; } /* 小卡片内字号缩小 */
  .pair-sep { align-self: center; font-size: 26px; font-weight: 700; color: #b1a9d8; } /* 中间连接符 – / = */
  .pair-ipa { margin-top: 8px; font-size: 15px; color: #888; min-height: 20px; } /* 该侧整词音标 */
  /* 卡片内按钮行:发音 + 拼读 */
  .pair-btns { margin-top: 10px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .pair-play, .pair-phonics-read {
    border: 1px solid #ddd6f3;
    background: #fff;
    color: #4a3b9c;
    font-size: 13px;
    padding: 5px 14px;
    border-radius: 16px;
    cursor: pointer;
    /* 图标 + 文字横向排列 */
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  }
  .pair-play svg, .pair-phonics-read svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .pair-phonics-read { border-color: #ffe8b8; background: #fff9ec; color: #b06e00; } /* 拼读按钮与下方"自然拼读"同色系 */
  .pair-play:active, .pair-phonics-read:active { opacity: .8; }
  .pair-play:disabled, .pair-phonics-read:disabled { opacity: .5; cursor: default; }
  @media (max-width: 720px) {
    .pair-wrap { flex-direction: column; } /* 窄屏上下堆叠两张小卡片 */
    .pair-card { max-width: 100%; }
    .pair-sep { transform: rotate(90deg); } /* 连接符转向,提示上下关系 */
  }

  /* 子分组标签(如:人称代词) */
  .flashcard .sub-name { font-size: 13px; color: #999; margin-top: 10px; }

  /* 中文释义:始终展示 */
  .flashcard .meaning {
    margin-top: 18px;
    font-size: 22px;
    color: #4a3b9c;
    font-weight: 600;
    min-height: 32px;
  }

  /* 发音按钮 */
  .sound-btns { margin-top: 18px; display: flex; justify-content: center; gap: 10px; }
  .btn-sound {
    border: none;
    background: #f1f3ff;
    color: #4a3b9c;
    font-size: 15px;
    padding: 10px 22px;
    border-radius: 24px;
    cursor: pointer;
    font-weight: 600;
    /* 图标 + 文字横向排列 */
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-sound svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .btn-sound:active { background: #dfe3ff; }
  .btn-sound:disabled { opacity: .6; cursor: default; }
  /* 自然拼读按钮:突出拼读功能 */
  .btn-phonics { background: #fff4e0; color: #b25e00; }
  .btn-phonics:active { background: #ffe9c7; }

  /* ============ 指定单词卡片:主释义/词组/近义词/词根词缀/词源 ============ */
  /* 详情区:卡片内滚动(页面保持一屏),各小节默认收起(词组默认展开),点标题切换 */
  .spec-detail {
    flex: 1 1 auto; min-height: 0;
    margin-top: 16px;
    background: #f8f7fd;
    border: 1px solid #ece9f7;
    border-radius: 14px;
    padding: 4px 14px;
    text-align: left;
    overflow-y: auto;
  }
  /* 主释义(指定单词):整条释义展示,字号小于普通词条 */
  .flashcard .meaning.spec { font-size: 16px; font-weight: 500; line-height: 1.6; min-height: 0; }
  /* 小节:标题行可点折叠 */
  .sp-sec { border-bottom: 1px solid #ece9f7; }
  .sp-sec:last-child { border-bottom: none; }
  .sp-sec-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 2px;
    font-size: 14px; font-weight: 700; color: #4a3b9c;
    cursor: pointer; user-select: none;
  }
  .sp-sec-head:active { opacity: .7; }
  .sp-count { font-size: 12px; font-weight: 400; color: #999; }
  .sp-caret { margin-left: auto; font-size: 10px; color: #b1a9d8; transition: transform .2s ease; }
  .sp-sec.open .sp-caret { transform: rotate(90deg); }
  .sp-sec-body { display: none; padding: 0 2px 12px; }
  .sp-sec.open .sp-sec-body { display: block; }

  /* 小节中文翻译(词组等) */
  .sp-cn { font-size: 13px; color: #999; margin-top: 2px; line-height: 1.5; }
  /* 词组发音按钮:平时小圆点,播放加载中会撑开显示文字 */
  .sp-play {
    flex-shrink: 0;
    border: none; background: #f1f3ff; color: #4a3b9c;
    min-width: 30px; height: 30px; padding: 0 8px;
    border-radius: 15px; cursor: pointer;
    font-size: 13px; line-height: 1;
    white-space: nowrap;
  }
  .sp-play:active { background: #dfe3ff; }
  .sp-play:disabled { opacity: .5; cursor: default; }
  /* 词组 */
  .sp-ph { display: flex; gap: 8px; align-items: center; padding: 6px 0; flex-wrap: wrap; }
  .sp-ph + .sp-ph { border-top: 1px dashed #ece9f7; }
  .sp-ph .sp-en { font-size: 14px; color: #4a3b9c; font-weight: 600; }
  .sp-ph .sp-cn { margin-top: 0; }
  /* 近义词 */
  .sp-syn { padding: 6px 0; font-size: 14px; line-height: 1.7; color: #333; }
  .sp-syn + .sp-syn { border-top: 1px dashed #ece9f7; }
  .sp-syn b { color: #7048e8; margin-right: 6px; font-weight: 600; }
  .sp-ws { margin-top: 4px; }
  .sp-ws i {
    font-style: normal; display: inline-block;
    background: #f0ecff; color: #5f3dc4;
    border-radius: 8px; padding: 2px 8px;
    margin: 0 6px 4px 0; font-size: 13px;
  }
  /* 词根词缀 */
  .sp-root { font-size: 13px; color: #999; padding: 4px 0; }
  .sp-rel { padding: 4px 0; font-size: 14px; }
  .sp-rel b { color: #7048e8; margin-right: 6px; font-weight: 600; }
  .sp-rel-word { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .sp-rel-word .sp-en { color: #4a3b9c; font-weight: 600; flex-shrink: 0; }
  .sp-rel-word .sp-cn { margin-top: 0; }
  /* 词源 */
  .sp-ety { padding: 6px 0; }
  .sp-ety + .sp-ety { border-top: 1px dashed #ece9f7; }
  .sp-ety .sp-en { font-size: 14px; font-weight: 600; color: #333; }
  .sp-ety .sp-cn { white-space: pre-line; } /* 词源长文保留换行 */

  /* ============ 学习页:自然拼读颜色图例 ============ */
  .legend {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 8px 14px;
    margin: 16px auto 0;
    font-size: 12px; color: rgba(255,255,255,.92);
  }
  .legend span::before {
    content: ""; display: inline-block;
    width: 10px; height: 10px; border-radius: 3px;
    margin-right: 5px; vertical-align: -1px;
    background: var(--c);
  }

  /* ============ 学习页:操作按钮区(四个按钮同一行) ============ */
  .action-row { display: flex; gap: 10px; margin-top: 18px; flex-shrink: 0; }
  .action-row button {
    flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none;
    padding: 14px 4px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .1s ease;
  }
  .action-row button:active { transform: scale(.97); }
  /* 按钮图标:与文字同色、垂直居中;手机端可单独隐藏文字只留图标 */
  .action-row svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .btn-nav  { background: rgba(255,255,255,.92); color: #4a3b9c; }           /* 上一个/下一个 */
  .btn-known    { background: #51cf66; color: #fff; }                        /* 已会 */
  .btn-wordbook { background: #ff922b; color: #fff; }                        /* 加入生词本 */
  /* 手机端按钮尺寸见文末"手机端紧凑布局" */

  /* ============ 学习完成弹层 ============ */
  .finish-mask {
    position: fixed; inset: 0;
    background: rgba(40, 30, 80, .55);
    display: none; align-items: center; justify-content: center;
    z-index: 998;
  }
  .finish-mask.show { display: flex; }
  .finish-box {
    background: #fff; border-radius: 20px;
    padding: 36px 32px; text-align: center;
    width: min(340px, 86vw);
    animation: fadeIn .25s ease;
  }
  .finish-box h2 { color: #4a3b9c; font-size: 22px; }
  .finish-box p { color: #888; font-size: 14px; margin: 14px 0 22px; line-height: 1.8; }
  .finish-box button {
    border: none; border-radius: 12px;
    padding: 12px 0; width: 100%;
    font-size: 15px; font-weight: 700; cursor: pointer;
    margin-top: 10px;
  }
  .finish-box .btn-again { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .finish-box .btn-home  { background: #f1f3ff; color: #4a3b9c; }

  /* ============ 章节切换弹层(点学习页右上角章节名打开) ============ */
  .chapter-mask {
    position: fixed; inset: 0;
    background: rgba(40, 30, 80, .55);
    display: none; align-items: center; justify-content: center;
    padding: 16px;
    z-index: 997; /* 低于 loading 遮罩,高于学习页内容 */
  }
  .chapter-mask.show { display: flex; }
  .chapter-box {
    background: #fff; border-radius: 20px;
    width: min(420px, 92vw);
    max-height: min(76vh, 640px);
    display: flex; flex-direction: column;
    overflow: hidden;
    animation: fadeIn .2s ease;
  }
  .chapter-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; border-bottom: 1px solid #f0eef8;
    font-size: 16px; font-weight: 700; color: #4a3b9c;
    flex-shrink: 0;
  }
  .chapter-close {
    border: none; background: #f1f3ff; color: #4a3b9c;
    width: 28px; height: 28px; border-radius: 50%;
    font-size: 14px; line-height: 1; cursor: pointer;
  }
  /* 章节列表:章节较多时在弹层内滚动,不影响页面整屏布局 */
  .chapter-list { overflow-y: auto; padding: 8px; }
  .chapter-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; text-align: left;
    border: none; background: none;
    padding: 11px 12px; border-radius: 10px;
    font-family: inherit; font-size: 15px; color: #333; cursor: pointer;
  }
  .chapter-item:hover { background: #f6f5fc; }
  .chapter-item .ch-id { color: #b1a9d8; font-weight: 700; flex-shrink: 0; }
  .chapter-item .ch-name { flex: 1; min-width: 0; }
  .chapter-item .ch-count { font-size: 12px; color: #999; flex-shrink: 0; }
  /* 当前正在学习的章节:紫色高亮,便于确认位置 */
  .chapter-item.current { background: #f0ecff; color: #5f3dc4; font-weight: 700; }
  .chapter-item.current .ch-id, .chapter-item.current .ch-count { color: #8f7ad6; }

  /* ============ 生词本页 ============ */
  .wordbook-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .wordbook-item {
    background: #fff;
    border-radius: 12px;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 3px 8px rgba(0,0,0,.1);
  }
  .wordbook-item .wb-word { font-size: 18px; font-weight: 700; flex: 1; }
  .wordbook-item .wb-word small { display: block; font-size: 12px; color: #999; font-weight: 400; }
  .wordbook-item button {
    border: none; border-radius: 8px;
    padding: 7px 12px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .wordbook-item .btn-play { background: #f1f3ff; color: #4a3b9c; }
  .wordbook-item .btn-remove { background: #ffe3e3; color: #e5484d; }
  .empty-tip { text-align: center; color: rgba(255,255,255,.85); margin-top: 40px; font-size: 15px; }

  /* ============ 生词本章节分类 ============ */
  .wb-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .wb-actions .wb-action-btn {
    flex: 1; min-width: 140px;
    border: none; border-radius: 12px;
    padding: 12px 16px; font-size: 14px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .wb-actions .wb-action-btn:active { opacity: .85; }
  .wb-test-all { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .wb-study-all { background: #fff; color: #4a3b9c; box-shadow: 0 3px 8px rgba(0,0,0,.1); }
  .wb-chapters { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .wb-chapter {
    background: #fff; border-radius: 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,.1);
    overflow: hidden;
  }
  .wb-chapter-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; cursor: pointer;
    user-select: none;
  }
  .wb-chapter-head:active { background: #faf9ff; }
  .wb-caret { font-size: 12px; color: #999; transition: transform .2s ease; flex-shrink: 0; }
  .wb-chapter.open .wb-caret { transform: rotate(90deg); }
  .wb-chapter-name { flex: 1; font-size: 15px; font-weight: 700; color: #333; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wb-chapter-count { font-size: 12px; color: #999; flex-shrink: 0; }
  .wb-chapter-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .wb-chapter-btns button {
    border: none; border-radius: 8px;
    padding: 6px 10px; font-size: 12px; font-weight: 600;
    cursor: pointer;
  }
  .wb-chapter-btns button:active { opacity: .8; }
  .wb-ch-btn { background: #f0ecff; color: #5f3dc4; }
  .wb-ch-study { background: #f1f3ff; color: #4a3b9c; }
  .wb-chapter-body { display: none; padding: 0 16px 12px; }
  .wb-chapter.open .wb-chapter-body { display: block; }
  .wb-chapter-body .wordbook-list { margin-top: 0; gap: 6px; }
  .wb-chapter-body .wordbook-item { padding: 10px 12px; }
  .wb-chapter-body .wordbook-item .wb-word { font-size: 16px; }

  /* ============ 单词测试页(听写 / 看中文写英文 / 看英文选中文) ============ */
  /* 与学习页同样的整屏布局:三个阶段各占满剩余高度,页面本身不滚动 */
  #view-test.active {
    display: flex; flex-direction: column;
    height: calc(var(--vh, 100vh) - var(--chrome, 148px));
  }
  /* 阶段容器:选模式(setup)/答题(quiz)/结果(result),同时只显示一个 */
  .test-stage { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .test-stage.show { display: flex; }

  /* 题源说明:已会 + 生词本共多少词可测 */
  .test-pool { font-size: 13px; color: rgba(255,255,255,.9); text-align: right; }
  .test-pool-tip {
    background: rgba(255,255,255,.16); color: #fff;
    border-radius: 12px; padding: 10px 14px;
    font-size: 13px; line-height: 1.6; margin-top: 4px;
  }

  /* 模式选择卡片:名称在上、说明在下(纵向排列) */
  .mode-list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; overflow-y: auto; }
  .mode-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    width: 100%; text-align: left;
    background: #fff; border: 2px solid transparent; border-radius: 14px;
    padding: 14px 16px; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 10px rgba(0,0,0,.12);
  }
  .mode-card .mode-name { font-size: 17px; font-weight: 700; color: #333; }
  .mode-card .mode-desc { font-size: 13px; color: #888; line-height: 1.5; }
  /* 选中的模式:紫色描边 + 浅紫底 */
  .mode-card.selected { border-color: #7048e8; background: #f6f3ff; }
  .mode-card.selected .mode-name { color: #5f3dc4; }

  /* 模式切换按钮(可多选) */
  .mode-toggles { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .mode-toggle {
    flex: 1; min-width: 90px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    border: 2px solid #e5e2f5; background: #fff; border-radius: 12px;
    padding: 10px 8px; cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    transition: border-color .15s, background .15s;
  }
  .mode-toggle .mt-name { font-size: 14px; font-weight: 700; color: #333; }
  .mode-toggle .mt-desc { font-size: 11px; color: #999; }
  .mode-toggle.selected { border-color: #7048e8; background: #f6f3ff; }
  .mode-toggle.selected .mt-name { color: #5f3dc4; }

  /* 测试配置区 */
  .test-config { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
  .tc-row { display: flex; flex-direction: column; gap: 6px; }
  .tc-label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.9); }
  .tc-select {
    width: 100%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.15);
    color: #fff; border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 14px;
  }
  .tc-select option { color: #333; }
  .tc-qty-row { display: flex; align-items: center; gap: 8px; }
  .tc-qty-row input {
    width: 80px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.15);
    color: #fff; border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 15px;
    text-align: center;
  }
  .tc-qty-row input:focus { outline: none; border-color: #ffd54f; }
  .tc-qty-row span { font-size: 13px; color: rgba(255,255,255,.8); }
  .tc-presets { display: flex; gap: 6px; }
  .tc-presets button {
    border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12);
    color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .tc-presets button:active { background: rgba(255,255,255,.25); }
  .tc-options { display: flex; flex-direction: column; gap: 8px; }
  .tc-opt {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: rgba(255,255,255,.9); cursor: pointer;
  }
  .tc-opt input[type="checkbox"] {
    width: 18px; height: 18px; accent-color: #ffd54f; cursor: pointer;
  }
  .tc-info {
    background: rgba(255,255,255,.12); border-radius: 10px; padding: 10px 14px;
    font-size: 13px; color: rgba(255,255,255,.85); line-height: 1.6;
  }
  .tc-mixed-label {
    font-size: 12px; color: #ffd54f; font-weight: 600; margin-left: 4px;
  }

  /* 开始测试按钮 */
  .btn-start-test {
    flex-shrink: 0;
    width: 100%; margin-top: 16px;
    border: none; border-radius: 14px; padding: 16px 0;
    font-family: inherit; font-size: 17px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #667eea, #764ba2);
    cursor: pointer;
  }
  .btn-start-test:disabled { opacity: .45; cursor: default; }

  /* 答题卡:题干 + 作答区 + 反馈 */
  .test-card {
    flex: 1 1 auto; min-height: 0;
    background: #fff; border-radius: 20px; padding: 28px 18px;
    box-shadow: 0 10px 28px rgba(0,0,0,.22);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    text-align: center;
  }
  .test-prompt { font-size: 14px; color: #999; }
  .test-question { font-size: 32px; font-weight: 800; color: #333; line-height: 1.35; word-break: break-word; }
  /* 题干里的音标行(看英文选中文模式) */
  .test-question .q-ipa { display: block; font-size: 17px; font-weight: 400; color: #777; margin-top: 8px; }
  /* 听写模式的大喇叭按钮:自动播一次,可随时重听 */
  .btn-listen {
    border: none; background: #f1f3ff; color: #4a3b9c;
    width: 62px; height: 62px; border-radius: 50%; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn-listen svg { width: 28px; height: 28px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .btn-listen:disabled { opacity: .55; cursor: default; }

  /* 写答题输入行 */
  .test-input-row { display: flex; gap: 10px; width: 100%; max-width: 420px; }
  .test-input-row input {
    flex: 1; min-width: 0;
    border: 2px solid #e5e2f5; border-radius: 12px;
    padding: 12px 14px; font-family: inherit; font-size: 18px; text-align: center;
  }
  .test-input-row input:focus { outline: none; border-color: #7048e8; }
  .test-input-row input:disabled { background: #fafafa; color: #555; }
  /* 判分后输入框着色:对=绿,错=红 */
  .test-input-row input.right { border-color: #51cf66; background: #f4fff6; }
  .test-input-row input.wrong { border-color: #e5484d; background: #fff5f5; }

  /* 选择题四个选项 */
  .test-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 480px; }
  .test-options button {
    border: 1px solid #e5e2f5; background: #faf9ff; color: #333;
    font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 14px 10px; border-radius: 12px; cursor: pointer;
  }
  .test-options button:disabled { cursor: default; }
  .test-options button.right { background: #d3f9d8; border-color: #51cf66; color: #2b8a3e; }
  .test-options button.wrong { background: #ffe3e3; border-color: #e5484d; color: #c92a2a; }

  /* 判分反馈行 */
  .test-feedback { font-size: 16px; font-weight: 700; min-height: 22px; }
  .test-feedback.right { color: #2b8a3e; }
  .test-feedback.wrong { color: #c92a2a; }

  /* 测试页底部操作行(答题:提交答案/下一题;结果页:复习错词/再来一遍/返回首页) */
  .test-actions { display: flex; gap: 10px; margin-top: 16px; flex-shrink: 0; }
  .test-actions button {
    flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; padding: 14px 4px; border-radius: 14px;
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform .1s ease;
  }
  .test-actions button:active { transform: scale(.97); }
  .test-actions button:disabled { opacity: .45; cursor: default; }
  .test-actions .btn-main { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .test-actions .btn-ghost { background: rgba(255,255,255,.92); color: #4a3b9c; }
  /* 复习错词:与生词本同色(错词已自动进生词本),仅结果页有错题时显示 */
  .test-actions .btn-review { background: #ff922b; color: #fff; }

  /* 结果页:统计 + 错题列表 */
  .result-summary {
    flex-shrink: 0;
    background: #fff; border-radius: 16px; padding: 16px;
    text-align: center; margin-top: 14px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }
  .result-summary .rs-big { font-size: 26px; font-weight: 800; color: #4a3b9c; }
  .result-summary .rs-sub { font-size: 13px; color: #888; margin-top: 6px; line-height: 1.6; }
  .result-list-title { flex-shrink: 0; margin: 14px 2px 8px; font-size: 14px; font-weight: 700; color: #fff; }
  /* 错题较多时列表内部滚动,页面仍保持一屏 */
  .result-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .result-item {
    background: #fff; border-radius: 12px; padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,.1);
    border-left: 3px solid #e5484d;
  }
  .result-item .ri-en { font-weight: 700; font-size: 16px; flex-shrink: 0; }
  .result-item .ri-zh { flex: 1; min-width: 0; font-size: 13px; color: #777; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 你的答案(写答题为拼写,选择题为选中的释义) */
  .result-item .ri-given { flex-shrink: 0; font-size: 12px; color: #c92a2a; background: #ffe3e3; padding: 3px 8px; border-radius: 10px; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ============ 手机端紧凑布局(集中放在文末,确保能覆盖前面的同名规则) ============
   * 目标:学习页一屏内看完卡片、操作按钮,单词导航铺到页面底部,不需要下拉 */
  @media (max-width: 720px) {
    /* 页眉与页面留白收紧,把学习页高度让给内容 */
    body { padding: 12px 10px calc(12px + env(safe-area-inset-bottom)); }
    header { margin-bottom: 12px; }
    header h1 { font-size: 22px; letter-spacing: 1px; }

    /* 顶部工具栏:章节切换按钮收窄,给返回键与进度留位置 */
    .study-source { padding: 6px 10px; font-size: 12px; max-width: 34vw; }

    /* 首页快捷入口:三个卡片改两列,测试入口独占第二行整宽 */
    .quick-entries { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    #entry-test { grid-column: 1 / -1; grid-row: 2; }

    /* 测试页:题干、选项与输入收紧,保证一屏内答完一题 */
    .test-card { padding: 18px 12px; gap: 12px; }
    .test-question { font-size: 26px; }
    .test-question .q-ipa { font-size: 15px; margin-top: 6px; }
    .btn-listen { width: 54px; height: 54px; }
    .btn-listen svg { width: 24px; height: 24px; }
    .test-options { gap: 8px; }
    .test-options button { padding: 12px 8px; font-size: 14px; }
    .test-input-row input { padding: 10px 12px; font-size: 16px; }
    .test-actions { gap: 8px; margin-top: 12px; }
    .test-actions button { padding: 12px 0; font-size: 15px; }

    /* 单词卡片:内边距与字号收紧,高度不足时可收缩 */
    .flashcard { padding: 22px 12px 16px; min-height: 0; }
    .phonics-word { font-size: 32px; line-height: 1.25; }
    .phonetic { margin-top: 8px; font-size: 17px; }
    .flashcard .meaning { margin-top: 12px; font-size: 20px; }
    .sound-btns { margin-top: 12px; gap: 8px; }
    .btn-sound { padding: 9px 18px; font-size: 14px; }

    /* 指定单词卡片:主释义与详情区收紧,保证卡面 + 折叠小节一屏放下 */
    .flashcard .meaning.spec { font-size: 14px; }
    .spec-detail { margin-top: 10px; padding: 2px 10px; }
    .sp-sec-head { padding: 8px 0; font-size: 13px; }
    .sp-cn { font-size: 12px; }

    /* 颜色图例非操作必需,手机端隐藏换出一屏空间 */
    .legend { display: none; }

    /* 词对卡片(同义/反义/缩略)纵向堆叠时进一步压缩 */
    .pair-card { padding: 10px 8px 8px; }
    .pair-card .phonics-word { font-size: 24px; }
    .pair-btns { margin-top: 6px; }

    /* 操作按钮:四键一行、只留图标(见 .action-row 基础样式) */
    .action-row { gap: 8px; margin-top: 12px; }
    .action-row button { padding: 12px 0; font-size: 0; }
    .action-row .btn-label { display: none; }
    .action-row svg { width: 22px; height: 22px; }

    /* 侧边单词导航:收窄宽度,高度仍随 .study-body 铺到页面底部 */
    .word-nav { width: 108px; }
    .word-nav-item { padding: 6px 8px; font-size: 13px; }
    .word-nav-item .nav-zh { display: none; } /* 窄屏只显示英文,节省横向空间 */
  }
</style>
</head>
<body>

<!-- 全屏 loading 遮罩 -->
<div id="loading-mask"><div class="spinner"></div></div>

<!-- 页面标题 -->
<header>
  <h1>自然拼读背单词</h1>
</header>

<!-- ============ 视图一:首页(分组列表) ============ -->
<div id="view-home" class="view active">
  <!-- 快捷入口:全部单词 / 单词测试 / 生词本 -->
  <div class="quick-entries">
    <div class="entry-card" id="entry-all">
      <div class="entry-title">全部单词</div>
      <div class="entry-count" id="entry-all-count"></div>
    </div>
    <div class="entry-card" id="entry-test">
      <div class="entry-title">单词测试</div>
      <div class="entry-count" id="entry-test-count"></div>
    </div>
    <div class="entry-card" id="entry-wordbook">
      <div class="entry-title">我的生词本</div>
      <div class="entry-count" id="entry-wordbook-count"></div>
    </div>
  </div>

  <!-- 分组卡片网格(每组含"开始背诵"入口) -->
  <div class="group-grid" id="group-grid"></div>
</div>

<!-- ============ 视图二:学习(单词卡片) ============ -->
<div id="view-study" class="view">
  <div class="study-topbar">
    <button class="btn-back" id="btn-study-back">‹ 返回</button>
    <div class="study-progress-text" id="study-progress-text">1/20</div>
    <!-- 章节名:点击弹出章节列表切换章节(内容由 app.js 填充) -->
    <button class="study-source" id="study-source" title="点击切换章节" aria-label="切换章节">
      <span class="src-name" id="study-source-name"></span><span class="src-caret">▾</span>
    </button>
  </div>
  <div class="study-progress"><i id="study-progress-bar" style="width:0%"></i></div>

  <div class="study-body">
    <div class="study-main">
      <!-- 单词卡片:释义始终展示 -->
      <div class="flashcard" id="flashcard">
        <span class="wordbook-badge" id="wordbook-badge">生词本</span>
        <span class="known-badge" id="known-badge">已会 ✓</span>
        <div class="phonics-word" id="phonics-word"></div>
        <div class="phonetic" id="phonetic"></div>
        <div class="sub-name" id="sub-name"></div>
        <div class="meaning" id="meaning"></div>
        <div class="sound-btns">
          <!-- 发音/自然拼读按钮:图标 + 文字(手机端只留图标,见文末紧凑布局) -->
          <button class="btn-sound" id="btn-sound" title="播放发音" aria-label="播放发音">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9a4.5 4.5 0 0 1 0 6"/></svg>
            <span class="btn-label">播放发音</span>
          </button>
          <button class="btn-sound btn-phonics" id="btn-phonics-read" title="自然拼读" aria-label="自然拼读">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16V9m5 7V5m5 11v-4m5 4V8"/></svg>
            <span class="btn-label">自然拼读</span>
          </button>
        </div>

        <!-- 指定单词详情:词组/近义词/词根词缀/词源(仅指定单词组渲染,小节可折叠;内容由 app.js 填充) -->
        <div class="spec-detail" id="spec-detail" style="display:none"></div>
      </div>

      <!-- 自然拼读颜色图例 -->
      <div class="legend">
        <span style="--c:#2b7de9">单辅音</span>
        <span style="--c:#7048e8">辅音组合</span>
        <span style="--c:#e5484d">单元音</span>
        <span style="--c:#f08c00">元音组合</span>
        <span style="--c:#2f9e44">长元音</span>
        <span style="--c:#adb5bd">不发音</span>
      </div>

      <!-- 操作按钮:四个按钮同一行,图标 + 文字(手机端只留图标,见下方媒体查询) -->
      <div class="action-row">
        <button class="btn-nav" id="btn-prev" title="上一个" aria-label="上一个">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          <span class="btn-label">上一个</span>
        </button>
        <button class="btn-nav" id="btn-next" title="下一个" aria-label="下一个">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          <span class="btn-label">下一个</span>
        </button>
        <button class="btn-wordbook" id="btn-add-wordbook" title="加入生词本" aria-label="加入生词本">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="btn-label">生词本</span>
        </button>
        <button class="btn-known" id="btn-known" title="已会" aria-label="已会">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 6"/></svg>
          <span class="btn-label">已会</span>
        </button>
      </div>
    </div>

    <!-- 侧边导航栏:当前分组所有单词,点击跳转,当前词高亮(置于右侧) -->
    <aside class="word-nav" id="word-nav"></aside>
  </div>
</div>

<!-- ============ 视图三:生词本(按章节分类) ============ -->
<div id="view-wordbook" class="view">
  <div class="study-topbar">
    <button class="btn-back" id="btn-wordbook-back">‹ 返回</button>
    <div class="study-progress-text">我的生词本</div>
    <div style="width:60px"></div>
  </div>
  <!-- 总生词本:统计 + 测试/背诵入口 -->
  <div class="test-pool-tip" id="wb-total-tip"></div>
  <div class="wb-actions">
    <button class="wb-action-btn wb-test-all" id="btn-wb-test-all">测试全部生词</button>
    <button class="wb-action-btn wb-study-all" id="btn-study-wordbook">开始背诵</button>
  </div>
  <!-- 按章节分组的生词列表(由 app.js 渲染) -->
  <div class="wb-chapters" id="wb-chapters"></div>
</div>

<!-- ============ 视图四:单词测试(支持混合模式) ============ -->
<div id="view-test" class="view">
  <!-- 阶段一:配置测试(选模式/范围/数量/选项) -->
  <div class="test-stage show" id="test-setup">
    <div class="study-topbar">
      <button class="btn-back" id="btn-test-back">‹ 返回</button>
      <div class="study-progress-text">单词测试</div>
      <div class="test-pool" id="test-pool-count"></div>
    </div>
    <!-- 测试范围选择(全部生词本/某章节) -->
    <div class="test-config">
      <div class="tc-row" id="tc-scope-row">
        <div class="tc-label">测试范围</div>
        <select class="tc-select" id="tc-scope"></select>
      </div>
      <!-- 模式选择(可多选,混合出题) -->
      <div class="tc-row">
        <div class="tc-label">题型选择<span class="tc-mixed-label" id="tc-mixed-label" style="display:none">(混合出题)</span></div>
        <div class="mode-toggles" id="mode-toggles"></div>
      </div>
      <!-- 题目数量 -->
      <div class="tc-row">
        <div class="tc-label">题目数量</div>
        <div class="tc-qty-row">
          <input type="number" id="tc-qty" min="1" max="200" value="20">
          <span>题(最多 <b id="tc-max-qty">0</b> 题)</span>
        </div>
        <div class="tc-presets" id="tc-presets">
          <button data-qty="10">10</button>
          <button data-qty="20">20</button>
          <button data-qty="30">30</button>
          <button data-qty="50">50</button>
        </div>
      </div>
      <!-- 额外选项 -->
      <div class="tc-row">
        <div class="tc-label">额外选项</div>
        <div class="tc-options">
          <label class="tc-opt"><input type="checkbox" id="tc-include-known"><span>包含已会单词</span></label>
        </div>
      </div>
      <!-- 题库信息 -->
      <div class="tc-info" id="tc-info"></div>
    </div>
    <button class="btn-start-test" id="btn-start-test">开始测试</button>
  </div>

  <!-- 阶段二:答题 -->
  <div class="test-stage" id="test-quiz">
    <div class="study-topbar">
      <button class="btn-back" id="btn-quiz-back">‹ 退出</button>
      <div class="study-progress-text" id="test-progress-text">1/10</div>
      <div class="test-pool" id="test-mode-name"></div>
    </div>
    <div class="study-progress"><i id="test-progress-bar" style="width:0%"></i></div>

    <div class="test-card">
      <!-- 题干说明(如:听发音,写出英文单词) -->
      <div class="test-prompt" id="test-prompt"></div>
      <!-- 题目主体:听写模式留空(只听发音),写英文模式为中文释义,选择模式为英文单词 -->
      <div class="test-question" id="test-question"></div>
      <!-- 重听按钮:三种模式出题都会自动朗读该词,随时可点这里重听 -->
      <button class="btn-listen" id="btn-test-listen" title="重听发音" aria-label="重听发音">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9a4.5 4.5 0 0 1 0 6"/></svg>
      </button>
      <!-- 看英文选中文:四个选项(由 app.js 渲染) -->
      <div class="test-options" id="test-options" style="display:none"></div>
      <!-- 听写 / 看中文写英文:英文输入框 -->
      <div class="test-input-row" id="test-input-row">
        <input type="text" id="test-input" placeholder="输入英文单词" aria-label="输入英文单词"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <!-- 判分反馈:正确/错误 + 正确答案 -->
      <div class="test-feedback" id="test-feedback"></div>
    </div>

    <!-- 主按钮:未判分时为"提交答案",判分后变"下一题"(最后一题为"查看结果") -->
    <div class="test-actions">
      <button class="btn-main" id="btn-test-main">提交答案</button>
    </div>
  </div>

  <!-- 阶段三:结果 -->
  <div class="test-stage" id="test-result">
    <div class="study-topbar">
      <button class="btn-back" id="btn-result-back">‹ 返回</button>
      <div class="study-progress-text">测试结果</div>
      <div class="test-pool" id="result-mode-name"></div>
    </div>
    <div class="result-summary" id="result-summary"></div>
    <div class="result-list-title" id="result-list-title">错题(已加入生词本)</div>
    <div class="result-list" id="result-list"></div>
    <div class="test-actions">
      <!-- 复习错词:进入学习页只背本组答错的词(无错题时隐藏,由 app.js 控制) -->
      <button class="btn-review" id="btn-review-wrong" style="display:none">复习错词</button>
      <button class="btn-main" id="btn-test-again">再来一遍</button>
      <button class="btn-ghost" id="btn-test-home">返回首页</button>
    </div>
  </div>
</div>

<!-- 学习完成弹层:可跳到下一章节、重学本章节或返回首页 -->
<div class="finish-mask" id="finish-mask">
  <div class="finish-box">
    <h2>本组学习完成 🎉</h2>
    <p id="finish-stats"></p>
    <!-- 下一章节:仅当前是章节会话且后面还有章节时显示(由 app.js 控制) -->
    <button class="btn-again" id="btn-next-chapter" style="display:none">下一章节</button>
    <button class="btn-home" id="btn-again">再来一遍</button>
    <button class="btn-home" id="btn-finish-home">返回首页</button>
  </div>
</div>

<!-- 章节切换弹层:点击学习页右上角章节名打开,点章节即切换 -->
<div class="chapter-mask" id="chapter-mask">
  <div class="chapter-box">
    <div class="chapter-head">
      <span>选择章节</span>
      <button class="chapter-close" id="btn-chapter-close" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div class="chapter-list" id="chapter-list"></div>
  </div>
</div>

<!-- 静态资源版本号:改动对应文件后同步 bump ?v= 值(日期,同日多次加 -N 后缀),避免浏览器缓存导致新功能不生效 -->
<!-- 词库数据(由 build_words_js.mjs 从 words.json 生成,含音标与自然拼读分段) -->
<script src="words.js?v=20260926"></script>
<!-- 指定单词背诵数据(96 词,含英美音标/完整释义/例句/词组/近义词/词根词缀/词源) -->
<script src="specified_words.js?v=20261110"></script>
<!-- 六上生词组数据(沪教版五四学制2024六上,Starter+Unit1~6,由 build_grade6.mjs 生成) -->
<script src="grade6_words.js?v=20261109"></script>
<!-- 应用逻辑 -->
<script src="app.js?v=20261110"></script>
</body>
</html>
